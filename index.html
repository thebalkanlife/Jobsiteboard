let filters = { type:"all", cost:"all", exp:"all", special:"all" };
let expandedName = null;

function renderBoards() {
  const container = document.getElementById('boardsContainer');
  const filtered = boards.filter(b => {
    if (filters.type !== "all" && b.type !== filters.type) return false;
    if (filters.cost !== "all" && b.cost !== filters.cost) return false;
    if (filters.exp !== "all" && !b.exp.includes(filters.exp)) return false;
    if (filters.special !== "all" && !b.special.includes(filters.special)) return false;
    return true;
  });

  document.getElementById('boardCount').textContent = filtered.length + ' platform' + (filtered.length !== 1 ? 's' : '') + ' found';

  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">No platforms match your current filters. Try broadening your selection.</div>';
    return;
  }

  container.innerHTML = filtered.map(b => {
    const isExpanded = expandedName === b.name;
    const costClass = b.cost === 'free' ? 'meta-cost-free' : b.cost === 'freemium' ? 'meta-cost-freemium' : 'meta-cost-paid';
    const tierClass = b.tier === 1 ? 'tier-1' : b.tier === 2 ? 'tier-2' : 'tier-3';
    const prosHTML = b.pros.map(p => `<li>${p}</li>`).join('');
    const consHTML = b.cons.map(c => `<li>${c}</li>`).join('');

    return `<div class="board-card${isExpanded ? ' expanded' : ''}" onclick="toggleExpand('${b.name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">
      <div class="board-header">
        <div>
          <div class="board-name">${b.name}</div>
          <div class="board-category">${b.typeLabel}</div>
        </div>
        <span class="tier-badge ${tierClass}">${b.tierLabel}</span>
      </div>
      <div class="board-desc">${b.desc}</div>
      <div class="board-meta">
        <span class="meta-tag ${costClass}">${b.costLabel}</span>
        <span class="meta-tag meta-type">${b.exp.join(' / ')}</span>
        <a class="meta-tag meta-link" href="${b.url}" target="_blank" onclick="event.stopPropagation()">Visit →</a>
      </div>
      <div class="board-detail">
        <div class="detail-grid">
          <div>
            <div class="detail-section">
              <div class="detail-label">Best For</div>
              <div class="detail-value">${b.bestFor}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">Roles Available</div>
              <div class="detail-value">${b.roles}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">Insider Note</div>
              <div class="detail-value">${b.note}</div>
            </div>
          </div>
          <div>
            <div class="detail-label">Pros & Cons</div>
            <div class="pro-con-grid">
              <ul class="pro-list">${prosHTML}</ul>
              <ul class="con-list">${consHTML}</ul>
            </div>
          </div>
        </div>
        <a class="visit-btn" href="${b.url}" target="_blank" onclick="event.stopPropagation()">Visit ${b.name} →</a>
      </div>
      ${!isExpanded ? '<div class="click-hint">Click to expand</div>' : ''}
    </div>`;
  }).join('');
}

function toggleExpand(name) {
  expandedName = expandedName === name ? null : name;
  renderBoards();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const filterType = btn.dataset.filter;
    const value = btn.dataset.value;
    filters[filterType] = value;
    btn.closest('.filter-options').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    expandedName = null;
    renderBoards();
  });
});

function resetFilters() {
  filters = { type:"all", cost:"all", exp:"all", special:"all" };
  expandedName = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-btn[data-value="all"]').forEach(b => b.classList.add('active'));
  renderBoards();
}

renderBoards();
</script>
